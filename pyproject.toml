[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reformatting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "layoutparser[ocr]>=0.3.4",
    "pymupdf>=1.26.1",
    "pymupdf4llm>=0.0.25",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pypdfium2>=5.1.0",
    "meilisearch>=0.38.0",
]

[project.scripts]
test-qna = "test_qna:main"

[tool.setuptools]
py-modules = ["test_qna"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "syrupy>=4.0.0",
    "pytest-xdist>=3.0.0",  # For parallel test execution
]

[tool.uv]
package = true
extra-index-url = ["https://download.pytorch.org/whl/cpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "snapshot: snapshot tests",
    "slow: marks tests as slow",
    "extractor: marks tests for specific extractor implementations",
]
